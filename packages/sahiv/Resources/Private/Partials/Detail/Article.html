<div class="col-12 col-sm-4">
    <div class="sah-container-one-to-one-aspect-ratio">
        <div class="sah-content-one-to-one-aspect-ratio">
            <f:for each="{article.images}" as="image">
                <f:image image="{image}" class="img-fluid rounded h-100 w-100" />
            </f:for>
        </div>
    </div>
</div>
<div class="col-12 col-sm-8">
    <div class="justify-content-between d-flex">
        <h5 class="my-auto">{article.title}</h5>
        <div>
            <f:security.ifAuthenticated>
                <div class="btn-group dropstart">
                    <button type="button" class="btn px-3 py-2 bg-primary rounded-3 text-white"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-three-dots-vertical" viewBox="0 0 16 16">
                            <path
                                d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0" />
                        </svg>
                    </button>
                    <ul class="dropdown-menu p-2">
                        <li class="py-1">
                            <f:link.action action="edit" arguments="{article: article}"
                                class="btn bg-primary text-white w-100">
                                <f:translate key="edit" extensionName="sahiv" />
                            </f:link.action>
                        </li>
                        <li class="py-1">
                            <f:link.action action="delete" arguments="{article: article}"
                                class="btn bg-primary text-white w-100">
                                <f:translate key="delete" extensionName="sahiv" />
                            </f:link.action>
                        </li>
                    </ul>
                </div>
            </f:security.ifAuthenticated>
        </div>
    </div>
    <table class="table">
        <tbody>
            <tr>
                <td>
                    <f:translate key="acronym" extensionName="sahiv" />
                </td>
                <td>{article.acronym}</td>
            </tr>
            <tr>
                <td>
                    <f:translate key="unit_price" extensionName="sahiv" />
                </td>
                <td>{article.unitPrice}€</td>
            </tr>
            <tr>
                <td>
                    <f:translate key="type" extensionName="sahiv" />
                </td>
                <td>{article.type.title}</td>
            </tr>
            <tr>
                <td>
                    <f:translate key="colors" extensionName="sahiv" />
                </td>
                <td>
                    <f:for each="{article.colors}" as="color">
                        {color.title}
                    </f:for>
                </td>
            </tr>
            <tr>
                <td>
                    <f:translate key="material" extensionName="sahiv" />
                </td>
                <td>{article.material.title}</td>
            </tr>
            <tr>
                <td>
                    <f:translate key="size" extensionName="sahiv" />
                </td>
                <td>{article.size}</td>
            </tr>
            <tr>
                <td>
                    <f:translate key="in_stock" extensionName="sahiv" />
                </td>
                <td>{article.inStock}</td>
            </tr>
        </tbody>
    </table>
    <p>{article.notes}</p>
</div>
<div class="col-12 mt-3">
    <f:if condition="{article.orders}">
        <h6 class="m-0">
            <f:translate key="orders" extensionName="sahiv" />:
        </h6>
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">
                            <f:translate key="title" extensionName="sahiv" />
                        </th>
                        <th scope="col">
                            <f:translate key="quantity" extensionName="sahiv" />
                        </th>
                        <th scope="col">
                            <f:translate key="price" extensionName="sahiv" />
                        </th>
                        <th scope="col">
                            <f:translate key="bought_at" extensionName="sahiv" />
                        </th>
                        <th scope="col">
                            <f:translate key="shop_name" extensionName="sahiv" />
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{article.orders}" as="order">
                        <f:if condition="{order.isOnlyAdjustment} === 0">
                            <tr>
                                <td>{order.title}</td>
                                <td>{order.packAmount * order.piecesPerPack}</td>
                                <td>{order.packAmount * order.packPrice}€</td>
                                <td>
                                    <f:format.date format="d.m.Y">{order.boughtAt}</f:format.date>
                                </td>
                                <td>
                                    <f:link.typolink parameter="{order.shopLink}" target="_blank">{order.shopName}
                                    </f:link.typolink>
                                </td>
                            </tr>
                        </f:if>
                    </f:for>
                </tbody>
            </table>
        </div>
    </f:if>
</div>
