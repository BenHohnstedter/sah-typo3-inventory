<div class="col-12 col-sm-4">
    <div class="sah-container-one-to-one-aspect-ratio">
        <div class="sah-content-one-to-one-aspect-ratio">
            <f:for each="{product.images}" as="image">
                <f:image image="{image}" class="img-fluid rounded h-100 w-100" />
            </f:for>
        </div>
    </div>
</div>
<div class="col-12 col-sm-8">
    <div class="justify-content-between d-flex">
        <h5 class="my-auto">{product.title}</h5>
        <div>
            <f:security.ifAuthenticated>
                <div class="btn-group dropstart">
                    <button type="button" class="btn px-3 py-2 bg-primary rounded-3 text-white"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-three-dots-vertical" viewBox="0 0 16 16">
                            <path
                                d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0" />
                        </svg>
                    </button>
                    <ul class="dropdown-menu p-2">
                        <li class="py-1">
                            <f:link.action action="edit" arguments="{product: product}"
                                class="btn bg-primary text-white w-100">
                                <f:translate key="edit" extensionName="sahiv" />
                            </f:link.action>
                        </li>
                        <li class="py-1">
                            <f:link.action action="delete" arguments="{product: product}"
                                class="btn bg-primary text-white w-100">
                                <f:translate key="delete" extensionName="sahiv" />
                            </f:link.action>
                        </li>
                    </ul>
                </div>
            </f:security.ifAuthenticated>
        </div>
    </div>
    <table class="table">
        <tbody>
            <tr>
                <td>
                    <f:translate key="acronym" extensionName="sahiv" />
                </td>
                <td>{product.acronym}</td>
            </tr>
            <tr>
                <td>
                    <f:translate key="type" extensionName="sahiv" />
                </td>
                <td>{product.type.title}</td>
            </tr>
            <tr>
                <td>
                    <f:translate key="colors" extensionName="sahiv" />
                </td>
                <td>
                    <f:for each="{product.colors}" as="color">
                        {color.title}
                    </f:for>
                </td>
            </tr>
            <tr>
                <td>
                    <f:translate key="size" extensionName="sahiv" />
                </td>
                <td>{product.size}</td>
            </tr>
            <tr>
                <td>
                    <f:translate key="material_price" extensionName="sahiv" />
                </td>
                <td>{product.materialPrice}€</td>
            </tr>
            <tr>
                <td>
                    <f:translate key="selling_price" extensionName="sahiv" />
                </td>
                <td>{product.sellingPrice}€</td>
            </tr>
            <tr>
                <td>
                    <f:translate key="working_hours" extensionName="sahiv" />
                </td>
                <td>{product.workingHours}</td>
            </tr>
            <tr>
                <td>
                    <f:translate key="crafted_at" extensionName="sahiv" />
                </td>
                <td>
                    <f:format.date format="d.m.Y">{product.craftedAt}</f:format.date>
                </td>
            <tr>
        </tbody>
    </table>
    <p>{product.notes}</p>
</div>
<div class="col-12 mt-3">
    <f:if condition="{product.productcomponents}">
        <h6 class="m-0">
            <f:translate key="components" extensionName="sahiv" />:
        </h6>
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">
                            <f:translate key="title" extensionName="sahiv" />
                        </th>
                        <th scope="col">
                            <f:translate key="used_amount" extensionName="sahiv" />
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{product.productcomponents}" as="productcomponent">
                        <tr>
                            <td>{productcomponent.article.title}</td>
                            <td>{productcomponent.usedAmount}</td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </div>
    </f:if>
</div>
