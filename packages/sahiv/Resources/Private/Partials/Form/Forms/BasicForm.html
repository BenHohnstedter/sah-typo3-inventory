<div class="row">
    <div class="col-12 mb-3">
        <label for="title" class="form-label">
            <f:translate key="title" extensionName="sahiv" />
        </label>
        <f:form.textfield property="title" class="form-control" id="title" required="true" />
    </div>
    <div class="col-12 mb-3">
        <label for="notes" class="form-label">
            <f:translate key="notes" extensionName="sahiv" />
        </label>
        <f:form.textarea property="notes" class="form-control" id="notes" />
    </div>
    <div class="col-12">
        <f:form.submit value="{f:translate(key: 'submit', extensionName: 'sahiv')}" class="btn bg-primary text-white" />
    </div>
</div>
