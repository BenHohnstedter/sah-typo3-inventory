<tr>
    <td>{order.title}</td>
    <td>{order.article.title}</td>
    <td>{order.packAmount}</td>
    <td>{order.packPrice}</td>
    <td>{order.piecesPerPack}</td>
    <td>
        <f:format.date format="d.m.Y">{order.boughtAt}</f:format.date>
    </td>
    <td>
        <f:link.typolink parameter="{order.shopLink}" target="_blank">
            {order.shopName}
        </f:link.typolink>
    </td>
    <td>{order.notes}</td>
    <f:security.ifAuthenticated>
        <td class="text-end">
            <div class="btn-group dropstart">
                <button type="button" class="btn px-3 py-2 bg-primary rounded-3 text-white" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-three-dots-vertical" viewBox="0 0 16 16">
                        <path
                            d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0" />
                    </svg>
                </button>
                <ul class="dropdown-menu p-2">
                    <li class="py-1">
                        <f:link.action action="edit" arguments="{order: order}" class="btn bg-primary text-white w-100">
                            <f:translate key="edit" extensionName="sahiv" />
                        </f:link.action>
                    </li>
                    <li class="py-1">
                        <f:link.action action="delete" arguments="{order: order}"
                            class="btn bg-primary text-white w-100">
                            <f:translate key="delete" extensionName="sahiv" />
                        </f:link.action>
                    </li>
                </ul>
            </div>
        </td>
    </f:security.ifAuthenticated>
</tr>
