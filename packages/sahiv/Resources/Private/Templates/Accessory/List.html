<h5 class="mb-3">
    <f:translate key="list" extensionName="sahiv" />
</h5>

<f:security.ifHasRole role="Admin">
    <f:render partial="Filter/AccessoryFilter.html" arguments="{_all}" />
    <f:render partial="Form/CreateLink.html" />
</f:security.ifHasRole>

<div class="container-fluid my-2">
    <div class="row">
        <f:for each="{accessories}" as="accessory" iteration="productIterator">
            <f:render partial="List/AccessoryItem" arguments="{accessory: accessory}" />
        </f:for>
    </div>
</div>
